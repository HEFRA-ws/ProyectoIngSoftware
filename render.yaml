services:
  - type: web
    name: vigia-sst
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod --ignore-scripts
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vigia
